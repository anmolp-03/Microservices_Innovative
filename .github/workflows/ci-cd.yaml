name: CI/CD Build, Scan and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Authenticate to GCP
        if: secrets.GCP_SA_KEY
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Build Docker images
        run: |
          docker build -t gcr.io/${{ env.GCP_PROJECT }}/menu-service:latest ./menu-service
          docker build -t gcr.io/${{ env.GCP_PROJECT }}/order-service:latest ./order-service
          docker build -t gcr.io/${{ env.GCP_PROJECT }}/bill-service:latest ./bill-service
          docker build -t gcr.io/${{ env.GCP_PROJECT }}/review-service:latest ./review-service

      - name: Scan images with Trivy
        uses: aquasecurity/trivy-action@v0.9.1
        with:
          scan-type: 'image'
          image-ref: |
            gcr.io/${{ env.GCP_PROJECT }}/menu-service:latest
            gcr.io/${{ env.GCP_PROJECT }}/order-service:latest
            gcr.io/${{ env.GCP_PROJECT }}/bill-service:latest
            gcr.io/${{ env.GCP_PROJECT }}/review-service:latest

      - name: Push images to GCR
        run: |
          gcloud auth configure-docker --quiet
          docker push gcr.io/${{ env.GCP_PROJECT }}/menu-service:latest
          docker push gcr.io/${{ env.GCP_PROJECT }}/order-service:latest
          docker push gcr.io/${{ env.GCP_PROJECT }}/bill-service:latest
          docker push gcr.io/${{ env.GCP_PROJECT }}/review-service:latest

      - name: Deploy to GKE (kubectl)
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER }} --region ${{ secrets.GKE_REGION }} --project ${{ env.GCP_PROJECT }}
          kubectl apply -f k8s/
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: '1'
