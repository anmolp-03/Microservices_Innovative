# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://root:example@localhost:27017/restaurant?replicaSet=rs0&authSource=admin}
spring.data.mongodb.database=${MONGODB_DATABASE:restaurant}

# Server Configuration
server.port=8080

# Logging Configuration
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.com.example.menu=DEBUG