apiVersion: v1
kind: Secret
metadata:
  name: service-db-creds
type: Opaque
data:
  # Use: echo -n 'postgres' | base64
  menu_db_user: <BASE64_USERNAME>
  menu_db_password: <BASE64_PASSWORD>
  menu_db_name: <BASE64_DBNAME>

  order_db_user: <BASE64_USERNAME>
  order_db_password: <BASE64_PASSWORD>
  order_db_name: <BASE64_DBNAME>

  bill_db_user: <BASE64_USERNAME>
  bill_db_password: <BASE64_PASSWORD>
  bill_db_name: <BASE64_DBNAME>

  review_db_user: <BASE64_USERNAME>
  review_db_password: <BASE64_PASSWORD>
  review_db_name: <BASE64_DBNAME>

# Replace <BASE64_...> values with actual base64-encoded secrets before applying.
