steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/menu-service:latest', './menu-service']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/order-service:latest', './order-service']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bill-service:latest', './bill-service']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/review-service:latest', './review-service']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/menu-service:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/order-service:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bill-service:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/review-service:latest']

# Deploy step: apply k8s manifests using gcloud-authenticated kubectl. Requires Cloud Build worker to have Kubernetes credentials.
  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['apply', '-f', 'k8s/']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=${_ZONE}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER}'

timeout: 1200s

substitutions:
  _CLUSTER: "restaurant-cluster"
  _ZONE: "us-central1-a"

images:
  - 'gcr.io/$PROJECT_ID/menu-service:latest'
  - 'gcr.io/$PROJECT_ID/order-service:latest'
  - 'gcr.io/$PROJECT_ID/bill-service:latest'
  - 'gcr.io/$PROJECT_ID/review-service:latest'

options:
  logging: CLOUD_LOGGING_ONLY
